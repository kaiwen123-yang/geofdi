# e21 — classical momentum-observer chi^2 baseline (Sprint 9 B1) on the e07/e08 fault grid.
experiment: e21_classical_baseline
workers: 20
sim:
  model: go2_urdf_sym
  gait: trot
  speed: 0.0
  terrain: flat
  ctrl_dt: 0.005
  sim_dt: 0.0025
  controller: {period_s: 0.5, kp: [80, 80, 80], kd: [2.0, 2.0, 2.0], lift_kfe: 0.45, lift_hfe: 0.20, stab_k_wz: 0.2}
  noise: {actuator_std: 0.02, encoder_pos_std: 0.002, encoder_vel_std: 0.03, torque_meas_std: 0.2, imu_acc_std: 0.1, imu_gyro_std: 0.01}
registration: {N: 64, drop_first: 20}
observer: {backend: pin, cutoff_hz: 10.0, torque: tau_cmd, armature: 0.01, damping: 0.01, frictionloss: 0.2}
detect: {alpha: 0.05, debounce: 5}
protocol: {R: 20, seed_base: 95000, K_cal: 60, K_post: 100, leg: LF, joint: KFE}
faults:
  actuator_gain: [0.95, 0.90, 0.80]
  actuator_bias: [0.5, 1.0]
  friction_scale: [1.2, 1.5]
nuisance:
  - {name: drift_sym, type: drift_symmetric, t_onset: 0.0, magnitude: 0.05, params: {tau_s: 20.0}}
  - {name: payload_sym, type: payload_symmetric, t_onset: 0.0, magnitude: 1.0}
