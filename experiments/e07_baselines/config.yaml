# e07 — baseline comparison under the unified FAR protocol (docs/protocol/baseline_protocol.md)
experiment: e07_baselines
workers: 22
sim:
  model: go2_urdf_sym
  gait: trot
  speed: 0.0
  terrain: flat
  ctrl_dt: 0.005
  sim_dt: 0.0025
  controller: {period_s: 0.5, kp: [80, 80, 80], kd: [2.0, 2.0, 2.0], lift_kfe: 0.45, lift_hfe: 0.20, stab_k_wz: 0.2}
  noise: {actuator_std: 0.02, encoder_pos_std: 0.002, encoder_vel_std: 0.03, torque_meas_std: 0.2, imu_acc_std: 0.1, imu_gyro_std: 0.01}
registration: {N: 64, drop_first: 20}
observer: {backend: pin, cutoff_hz: 10.0, torque: tau_cmd, armature: 0.01, damping: 0.01, frictionloss: 0.2}
detect: {alpha: 0.05, M: 512, window_rminus: 5, ecusum_horizon_windows: 20, ecusum_boot: 2000}
protocol:
  K_cal: 60                          # nominal calibration cycles per run (all detectors)
  K_post: 100
  leg: LF
  joints: [HFE, KFE]
window: {win: 50, stride_train: 10, stride_test: 10}
gru: {hidden: 64, layers: 2, epochs: 6, batch: 512, lr: 0.001}
ae: {latent: 32, hidden: 256, epochs: 20, batch: 512, lr: 0.001}
train:                               # GRU training data (fault + nominal); AE / Mahalanobis: nominal_reps only
  seed_base: 61000
  nominal_reps: 16
  fault_reps: 6                      # per (type, magnitude, joint) cell of the SEEN magnitudes
  seen:                              # magnitudes the GRU is trained on
    actuator_gain: [0.8]
    actuator_bias: [1.0]
    friction_scale: [2.0]
    inertia_add: [0.1]
  unseen_type_holdout: inertia_add   # second GRU trained WITHOUT this type (generalization table)
test:
  seed_base: 62000
  R: 10
  grid:                              # the e04a grid (magnitudes as fault-spec magnitudes; kappa = 1 + m for gain)
    actuator_gain: [-0.1, -0.2, -0.3, -0.5]
    actuator_bias: [0.5, 1.0, 2.0]
    friction_scale: [0.5, 1.0, 2.0]
    inertia_add: [0.05, 0.1, 0.2]
  nuisance_R: 20
  nuisances:
    nominal: {type: none}                                   # no injection: the true false-alarm fraction of every detector at the unified rule
    drift_sym: {type: drift_symmetric, magnitude: 0.1, params: {tau_s: 20.0}}
    payload_sym: {type: payload_symmetric, magnitude: 1.0}
