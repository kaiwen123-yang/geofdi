# e15 — three pre-registered prediction experiments for the N1-2 two-layer theorem (Sprint 8 Block P).
# Pre-registration: docs/protocol/e15_preregistration.md (committed before any run). alpha 0.05; R- has zero trainable params.
experiment: e15_predictions
workers: 20
sim_go2:
  model: go2_urdf_sym
  speed: 0.0
  terrain: flat
  ctrl_dt: 0.005
  sim_dt: 0.0025
  controller: {period_s: 0.5, kp: [80, 80, 80], kd: [2.0, 2.0, 2.0], lift_kfe: 0.45, lift_hfe: 0.20, stab_k_wz: 0.2}
  noise: {actuator_std: 0.02, encoder_pos_std: 0.002, encoder_vel_std: 0.03, torque_meas_std: 0.2, imu_acc_std: 0.1, imu_gyro_std: 0.01}
registration: {N: 64, drop_first: 20}
detect: {alpha: 0.05, M: 512, window_rminus: 5}
p1_chirality:                       # bilateral mirror-equal actuator gain on LF+RF
  R: 30
  seed_base: 80000
  K_cal: 40
  K_post: 60
  kappas: [0.7, 0.5, 0.4, 0.3]
p2_statistic:                       # zero-mean LF encoder-noise variance inflation (std x2)
  R: 50
  seed_base: 80500
  K_cal: 40
  K_post: 60
  torque_meas_noise_scale_mag: 1.0  # tau_meas recording-noise std x2 -> variance x4 (pure zero-mean, not fed back)
  leg: LF
p3_slip:
  R: 30
  seed_base: 81000
  K_cal: 40
  K_post: 60
  go2_friction_mag: -0.5            # foot_friction x0.5
  m1_wheel_mag: -0.5               # wheel_friction x0.5
  m1:
    model: m1_wheeled_sym
    speed: 1.0
    duration_s: 60.0
    warmup_s: 6.0
    L_s: 1.0
  inekf: {sigma_gyro: 0.01, sigma_accel: 0.1, sigma_enc: 3.0e-3, sigma_contact: 3.0e-3, sigma_kin_floor: 3.0e-3, sigma_roll: 0.06, sigma_slip: 3.0e-3, far_alpha: 0.05}
