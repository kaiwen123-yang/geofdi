experiment: e18_m1_real
sessions:                                   # raw/m1/nominal/<name> (payload fingerprints in the audit doc §12)
  - m1_walk_20260810_172847
  - m1_walk_20260810_173028
  - m1_walk_20260810_173247
primary: m1_walk_20260810_173028
inekf:
  # noise settings = e10 nis_smoke (sim), unchanged
  sigma_gyro: 0.01
  sigma_accel: 0.1
  sigma_enc: 3.0e-3
  sigma_contact: 3.0e-3
  sigma_kin_floor: 3.0e-3
  sigma_roll: 0.06
  sigma_slip: 3.0e-3
