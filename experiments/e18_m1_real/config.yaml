  contact_points_body:
    LF: [0.35, 0.22, -0.54]
    RF: [0.35, -0.22, -0.54]
    LH: [-0.27, 0.24, -0.54]
    RH: [-0.27, -0.24, -0.54]
  filters: [rolling_riekf, rolling_eskf, fixed_riekf, fixed_eskf]
