[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geofdi"
version = "0.0.1"
description = "Geometric fault detection and isolation for manipulators and legged robots"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyyaml",
    "pandas",
    "pyarrow",
]

[project.optional-dependencies]
sim = ["mujoco==3.11.0"]
dyn = ["pin"]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
